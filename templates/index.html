<!DOCTYPE html>
<html>

<head>

<title>SignSetu - AI Sign Language Translator</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar">

<div class="logo">🤟 SignSetu</div>

</nav>


<div class="main-container">

<h1>AI Sign Language Translator</h1>

<p class="subtitle">
Translate sign language into text and speech in real-time
</p>


<div class="translator-container">

<div class="camera-section">

<video id="camera" autoplay playsinline class="camera"></video>
<canvas id="canvas" style="display:none;"></canvas>

</div>


<div class="output-section">

<h2>Detected Sign</h2>

<div id="sentenceBox">Waiting for signs...</div>


<div class="buttons">

<button onclick="speakSentence()">🔊 Speak</button>

</div>

</div>

</div>

</div>



<script>

const video = document.getElementById("camera")
const canvas = document.getElementById("canvas")
const sentenceBox = document.getElementById("sentenceBox")

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
    video.srcObject = stream
})


function captureFrame(){

    canvas.width = video.videoWidth
    canvas.height = video.videoHeight

    const ctx = canvas.getContext("2d")

    ctx.drawImage(video,0,0)

    canvas.toBlob(sendFrame,"image/jpeg")

}


function sendFrame(blob){

    let formData = new FormData()

    formData.append("image",blob)

    fetch("/predict",{
        method:"POST",
        body:formData
    })
    .then(res=>res.json())
    .then(data=>{

        sentenceBox.innerText = data.prediction

    })

}

setInterval(captureFrame,700)


function speakSentence(){

let text=document.getElementById("sentenceBox").innerText

let speech=new SpeechSynthesisUtterance(text)

speech.lang="en-US"

speechSynthesis.speak(speech)

}

</script>

</body>

</html>
