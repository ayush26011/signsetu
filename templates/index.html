<!DOCTYPE html>
<html>

<head>

<title>SignSetu - AI Sign Language Translator</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

</head>

<body>

<nav class="navbar">
<div class="logo">🤟 SignSetu</div>
</nav>

<div class="main-container">

<h1>AI Sign Language Translator</h1>

<p class="subtitle">
Translate sign language into text and speech in real-time
</p>

<div class="translator-container">

<div class="camera-section">
<video id="camera" autoplay playsinline class="camera"></video>
<canvas id="canvas"></canvas>
</div>

<div class="output-section">

<h2>Detected Sign</h2>

<div id="sentenceBox">Waiting for signs...</div>

<div class="buttons">
<button onclick="speakSentence()">🔊 Speak</button>
</div>

</div>

</div>

</div>

<script>

const video=document.getElementById("camera")
const canvas=document.getElementById("canvas")
const ctx=canvas.getContext("2d")
const sentenceBox=document.getElementById("sentenceBox")

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
video.srcObject=stream
})

const hands=new Hands({
locateFile:(file)=>{
return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
}
})

hands.setOptions({
maxNumHands:1,
minDetectionConfidence:0.7,
minTrackingConfidence:0.7
})

let buffer=[]
let sentence=[]
let lastWord=""
let sending=false

const BUFFER_SIZE=8


hands.onResults(results=>{

canvas.width=video.videoWidth
canvas.height=video.videoHeight

ctx.clearRect(0,0,canvas.width,canvas.height)
ctx.drawImage(video,0,0)

if(results.multiHandLandmarks){

for(const landmarks of results.multiHandLandmarks){

drawConnectors(ctx,landmarks,HAND_CONNECTIONS,
{color:'#00FF00',lineWidth:4})

drawLandmarks(ctx,landmarks,
{color:'#FF0000',lineWidth:2})

if(!sending){
captureFrame()
}

}

}

})


function captureFrame(){

sending=true

const tempCanvas=document.createElement("canvas")
tempCanvas.width=video.videoWidth
tempCanvas.height=video.videoHeight

const tempCtx=tempCanvas.getContext("2d")

tempCtx.drawImage(video,0,0)

tempCanvas.toBlob(blob=>{

let formData=new FormData()
formData.append("image",blob)

fetch("/predict",{
method:"POST",
body:formData
})
.then(res=>res.json())
.then(data=>{

handlePrediction(data.prediction)

setTimeout(()=>{
sending=false
},800)

})

},"image/jpeg")

}


function handlePrediction(word){

if(word==="No Hand" || word==="Uncertain") return

buffer.push(word)

if(buffer.length>BUFFER_SIZE)
buffer.shift()

let counts={}

buffer.forEach(w=>{
counts[w]=(counts[w]||0)+1
})

let best=Object.keys(counts).reduce((a,b)=>
counts[a]>counts[b]?a:b)

addToSentence(best)

}


function addToSentence(word){

if(word===lastWord) return

sentence.push(word)

if(sentence.length>6)
sentence.shift()

lastWord=word

sentenceBox.innerText=sentence.join(" ")

speakWord(word)

}


function speakWord(word){

let speech=new SpeechSynthesisUtterance(word)
speech.lang="en-US"

speechSynthesis.speak(speech)

}


function speakSentence(){

let text=sentenceBox.innerText

let speech=new SpeechSynthesisUtterance(text)

speech.lang="en-US"

speechSynthesis.speak(speech)

}


const camera=new Camera(video,{
onFrame:async()=>{
await hands.send({image:video})
},
width:640,
height:480
})

camera.start()

</script>

</body>

</html>
